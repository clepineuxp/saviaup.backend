name: Compilar Dev y Enviar API a Produccion (FTP)

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy-api:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Descargar el código fuente
      uses: actions/checkout@v4

    - name: 2. Configurar .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: 3. Restaurar dependencias
      run: dotnet restore

    - name: 4. Ejecutar Pruebas Unitarias
      run: dotnet test --no-restore -c Release

    - name: 5. Publicar la API de SaviaUp
      run: dotnet publish saviaup.backend.Api/saviaup.backend.Api.csproj -c Release -o ./publish-api

    - name: 6. Generar appsettings.json y appsettings.Production.json con Variables de GitHub
      run: |
        cat << 'EOF' > ./publish-api/appsettings.json
        {
          "ConnectionStrings": {
            "ApplicationDatabase": "${{ vars.APPLICATIONDATABASE }}",
            "PlatformDatabase": "${{ vars.PLATFORMDATABASE }}"
          },
          "Jwt": {
            "Issuer": "saviaup-api",
            "Audience": "saviaup-web",
            "SigningKey": "${{ vars.SIGNINGKEY }}",
            "AccessTokenExpirationMinutes": 15,
            "RefreshTokenExpirationDays": 30
          },
          "PasswordPolicy": {
            "MinimumLength": 10,
            "RequireUppercase": true,
            "RequireLowercase": true,
            "RequireDigit": true,
            "RequireSpecialCharacter": true
          },
          "Frontend": {
            "BaseUrl": "${{ vars.FRONTEND_BASEURL }}"
          },
          "Email": {
            "Mode": "Development"
          },
          "Cors": {
            "AllowedOrigins": [ ${{ vars.ALLOWEDORIGINS }} ]
          },
          "Logging": {
            "LogLevel": {
              "Default": "Information",
              "Microsoft.AspNetCore": "Warning"
            }
          },
          "AllowedHosts": "*"
        }
        EOF
        cp ./publish-api/appsettings.json ./publish-api/appsettings.Production.json

    # --- PASO CLAVE 1: Subir app_offline.htm para detener IIS ---
    - name: 6. Apagar IIS (Subir app_offline.htm)
      env:
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_USER: ${{ secrets.FTP_USERNAME }}
        FTP_PASS: ${{ secrets.FTP_PASSWORD }}
      run: |
        echo '<html><head><meta charset="utf-8"></head><body style="font-family:sans-serif;text-align:center;padding:40px;"><h1>SaviaUp API en Mantenimiento</h1><p>Actualizando servicios del sistema, por favor espere unos segundos...</p></body></html>' > app_offline.htm
        curl -sS --ftp-pasv -T app_offline.htm -u "$FTP_USER:$FTP_PASS" "ftp://$FTP_SERVER/api/app_offline.htm" || true
        echo "app_offline.htm subido exitosamente."

    # --- PASO CLAVE 2: Esperar a que IIS libere los archivos ---
    - name: 7. Esperar liberación de DLLs en IIS
      run: |
        echo "Esperando 15 segundos para que IIS libere los bloqueos de archivos..."
        sleep 15

    # --- PASO CLAVE 3: Despliegue FTP ---
    - name: 8. Despliegue por FTP al Servidor
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish-api/
        server-dir: /api/
        dangerous-clean-slate: false

    # --- PASO CLAVE 4: Encender IIS (Eliminar app_offline.htm) ---
    - name: 9. Reactivar API en IIS
      if: always()
      env:
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_USER: ${{ secrets.FTP_USERNAME }}
        FTP_PASS: ${{ secrets.FTP_PASSWORD }}
      run: |
        curl -sS --ftp-pasv -u "$FTP_USER:$FTP_PASS" "ftp://$FTP_SERVER/" -Q "DELE api/app_offline.htm" || true
        echo "app_offline.htm removido. API SaviaUp operativa en producción."
