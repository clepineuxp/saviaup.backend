services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: saviaup
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - saviaup-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saviaup"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__SaviaUp: Host=postgres;Port=5432;Database=saviaup;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY to at least 32 bytes}
      Frontend__BaseUrl: http://localhost:4200
      Cors__AllowedOrigins__0: http://localhost:4200
      Email__Mode: Development
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  saviaup-postgres:
